<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const container = document.getElementById("root");
      const root = ReactDOM.createRoot(container);

      function Button({ operator, onClick, isDisabled }) {
        return (
          <button onClick={onClick} disabled={isDisabled}>
            {operator}
          </button>
        );
      }

      function CounterPage() {
        const [number, setNumber] = React.useState(0);

        function handleClick(operator) {
          setNumber((num) => {
            if (operator === "+" && num < 10) return num + 1;
            if (operator === "-" && num > 0) return num - 1;
            if (operator === "reset") return 0;
            return num;
          });
        }

        function checkNumber(num, operator) {
          if (operator === "-" && num === 0) return true;
          if (operator === "+" && num === 10) return true;
          if (operator === "reset" && num === 0) return true;
          return false;
        }

        return (
          <>
            <h1>Counter with React</h1>

            <Button
              operator="-"
              onClick={() => handleClick("-")}
              isDisabled={checkNumber(number, "-")}
            />

            {number}

            <Button
              operator="+"
              onClick={() => handleClick("+")}
              isDisabled={checkNumber(number, "+")}
            />

            <br />

            <Button
              operator="reset"
              onClick={() => handleClick("reset")}
              isDisabled={checkNumber(number, "reset")}
            />
          </>
        );
      }

      root.render(<CounterPage />);
    </script>
  </body>
</html>
